services:
  localiza-aluno:
    build: .
    image: localiza-aluno:latest
    container_name: localiza-aluno
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8000"   # porta no servidor: defina APP_PORT no .env (padrão 8090)
    environment:
      TZ_NAME: America/Belem
      SESSION_TTL_MIN: "60"  # minutos até descartar os dados da memória
      MAX_UPLOAD_MB: "40"
      # Proteção opcional por usuário/senha (recomendado se o acesso for pela internet):
      # APP_USER: "secretaria"
      # APP_PASSWORD: "troque-esta-senha"

      # Aviso por e-mail ao administrador quando uma importação falha (só dados técnicos, nunca dados de alunos).
      # NÃO grave a senha neste arquivo se ele for para um repositório: use o campo "Environment variables" da stack no Portainer.
      # Gmail exige "Senha de app" (conta com verificação em 2 etapas), não a senha normal.
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_USER: "localizaaluno@xinguara.pa.gov.br"
      # SMTP_PASSWORD: "${SMTP_PASSWORD}"
      # ADMIN_EMAIL: "quem-recebe-os-avisos@xinguara.pa.gov.br"
